name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Grant the necessary permissions for the deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent multiple concurrent deployments
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: "true"   # Tells Vite to use base: '/weblooper/'

      - name: Setup Pages
        uses: actions/configure-pages@v4
        # Note: Do NOT use enablement: true here.
        # It often fails with "Resource not accessible by integration".
        # The user must manually set Source → GitHub Actions once in repo Settings > Pages.
        # After that one-time step, this workflow will deploy successfully on every push.

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The dist folder produced by Vite
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
